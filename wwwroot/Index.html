<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин игр</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Магазин игр</h1>
        <nav>
            <a href="/AddGame.html">Добавить игру</a>
        </nav>
    </header>

    <main>
        <section id="search-filters">
            <h2>Поиск</h2>
            <form id="search-form">
                <input type="text" id="author" placeholder="Автор">
                <input type="text" id="genre" placeholder="Жанр">
                <input type="submit" value="Поиск">
            </form>
        </section>
        <section id="games-list">
            <h2>Список игр</h2>
            <div id="games-container"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Магазин игр</p>
    </footer>

    <script>
        document.getElementById('search-form').addEventListener('submit', function (event) {
            event.preventDefault();

            const author = document.getElementById('author').value;
            const genre = document.getElementById('genre').value;

            // Отправка фильтров на сервер
            fetch(`/games?author=${author}&genre=${genre}`)
                .then(response => response.json())
                .then(data => {
                    const gamesContainer = document.getElementById('games-container');
                    gamesContainer.innerHTML = '';
                    data.forEach(game => {
                        const gameElement = document.createElement('div');
                        gameElement.classList.add('game');

                        const imagePath = `/files/${game.fileKey}`;
                        gameElement.innerHTML = `
                                    <img src="${imagePath}" alt="${game.name}" class="game-image"/>
                                    <h3>${game.name}</h3>
                                    <p>Жанр: ${game.genre}</p>
                                    <p>Автор: ${game.author}</p>
                                    <a href="/GameDetails.html?id=${game.id}" class="game-link">Подробнее</a>
                                `;

                        gamesContainer.appendChild(gameElement);
                    });
                });
        });
    </script>
</body>
</html>
